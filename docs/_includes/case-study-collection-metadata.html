<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {"@type": "CollectionPage", "@id": "{{ page.canonical_url }}#webpage", "url": "{{ page.canonical_url }}", "name": {{ page.title | jsonify }}, "description": {{ page.description | jsonify }}, "inLanguage": "en", "isPartOf": {"@id": "{{ '/' | absolute_url }}#website"}, "mainEntity": {"@id": "{{ page.canonical_url }}#case-studies"}, "primaryImageOfPage": {"@id": "{{ page.image | absolute_url }}#image-object"}, "dateModified": {{ page.last_modified_at | jsonify }}, "license": {{ page.license | jsonify }}},
    {"@type": "ItemList", "@id": "{{ page.canonical_url }}#case-studies", "name": "Spherity Research case studies", "numberOfItems": {{ site.data.case_studies | size }}, "itemListElement": [
      {% for case in site.data.case_studies %}{"@type": "ListItem", "position": {{ forloop.index }}, "item": {"@type": "TechArticle", "@id": "{{ case.url | absolute_url }}#article", "url": "{{ case.url | absolute_url }}", "name": {{ case.title | jsonify }}, "description": {{ case.summary | jsonify }}, "genre": {{ case.status | jsonify }} } }{% unless forloop.last %},{% endunless %}{% endfor %}
    ]},
    {"@type": "BreadcrumbList", "itemListElement": [{"@type": "ListItem", "position": 1, "name": "Spherity Research", "item": "{{ '/' | absolute_url }}"}, {"@type": "ListItem", "position": 2, "name": "Case studies", "item": "{{ page.canonical_url }}"}]},
    {"@type": "ImageObject", "@id": "{{ page.image | absolute_url }}#image-object", "contentUrl": "{{ page.image | absolute_url }}", "name": {{ page.image_alt | jsonify }}, "description": {{ page.image_alt | jsonify }}, "width": 1200, "height": 630, "encodingFormat": "image/webp", "creator": {"@type": "Organization", "name": "Spherity GmbH"}, "creditText": "Spherity Research / Spherity GmbH", "copyrightNotice": "© 2026 Spherity GmbH", "license": {{ page.license | jsonify }}, "acquireLicensePage": "{{ page.canonical_url }}#content-license"}
  ]
}
</script>
