<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="figure-3-vehicle-data-variant-title figure-3-vehicle-data-variant-desc" font-family="Arial, Liberation Sans, sans-serif">
<title id="figure-3-vehicle-data-variant-title">The same set-up for vehicle data processing and labelling</title>
<desc id="figure-3-vehicle-data-variant-desc">A vehicle streams sensor data to a gateway that signs frames, an AI labelling agent issues an AI Labelling Result credential, and a data product portal issues a Data Provenance Certificate credential to the data consumer. A fictional processor identified by an EUCC issues device identity, Agent Card and Task Authorization; TÜV SÜD certifies the AI labelling system and the gateway.</desc>
<rect x="0" y="0" width="1280" height="600" fill="#FFFFFF"/>
<defs>
          <marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#526273"/></marker>
          <marker id="ar3-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#167D8D"/></marker>
        </defs>

        <!-- Row 1: trust layer -->
        <g><rect fill="#EEF4FA" stroke="#183B63" stroke-width="1.2" stroke-dasharray="5 3" x="40" y="30" width="180" height="70" rx="12"/>
          <text font-size="12.5" font-weight="700" fill="#172536" x="130" y="58" text-anchor="middle">TÜV SÜD</text>
          <text font-size="11" fill="#526273" x="130" y="76" text-anchor="middle">conformity assessment body</text></g>
        <g><rect fill="#EEF4FA" stroke="#183B63" stroke-width="1.2" stroke-dasharray="5 3" x="300" y="30" width="420" height="70" rx="12"/>
          <text font-size="12.5" font-weight="700" fill="#172536" x="510" y="56" text-anchor="middle">MobilityData GmbH (fictional) · legal person</text>
          <text font-size="11" fill="#526273" x="510" y="74" text-anchor="middle">Business Wallet · holds EUCC · issues device, agent and task credentials</text>
          <text font-family="Liberation Mono, Courier New, monospace" font-size="10.5" fill="#526273" x="510" y="90" text-anchor="middle">did:web:mobilitydata.example</text></g>
        <g><rect fill="#EEF4FA" stroke="#183B63" stroke-width="1.2" stroke-dasharray="5 3" x="800" y="30" width="220" height="70" rx="12"/>
          <text font-size="12.5" font-weight="700" fill="#172536" x="910" y="58" text-anchor="middle">Bundesanzeiger Verlag</text>
          <text font-size="11" fill="#526273" x="910" y="76" text-anchor="middle">register · EUCC issuer</text></g>

        <!-- Trust edges -->
        <path fill="none" stroke="#526273" stroke-width="1.2" stroke-dasharray="5 3" d="M800,65 H724" marker-end="url(#ar3)"/>
        <text font-size="10.5" fill="#526273" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" x="760" y="55" text-anchor="middle">EUCC</text>
        <path fill="none" stroke="#526273" stroke-width="1.2" stroke-dasharray="5 3" d="M220,65 H296" marker-end="url(#ar3)"/>
        <text font-size="10.5" fill="#526273" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" x="258" y="55" text-anchor="middle">AI labelling</text>
        <text font-size="10.5" fill="#526273" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" x="258" y="86" text-anchor="middle">certificate</text>
        <path fill="none" stroke="#526273" stroke-width="1.2" stroke-dasharray="5 3" d="M130,100 V160 H310 V226" marker-end="url(#ar3)"/>
        <text font-size="10.5" fill="#526273" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" x="220" y="152" text-anchor="middle">gateway certificate</text>
        <path fill="none" stroke="#526273" stroke-width="1.2" stroke-dasharray="5 3" d="M380,100 V226" marker-end="url(#ar3)"/>
        <text font-size="10.5" fill="#526273" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" x="388" y="190" text-anchor="start">device identity</text>
        <path fill="none" stroke="#526273" stroke-width="1.2" stroke-dasharray="5 3" d="M640,100 V226" marker-end="url(#ar3)"/>
        <text font-size="10.5" fill="#526273" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" x="648" y="176" text-anchor="start">Agent Card +</text>
        <text font-size="10.5" fill="#526273" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" x="648" y="190" text-anchor="start">Task Authorization</text>
        <path fill="none" stroke="#526273" stroke-width="1.2" stroke-dasharray="5 3" d="M700,100 V160 H905 V226" marker-end="url(#ar3)"/>
        <text font-size="10.5" fill="#526273" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" x="802" y="152" text-anchor="middle">signs as legal person</text>

        <!-- Row 2: operational flow -->
        <g><rect fill="#FFFFFF" stroke="#526273" stroke-width="1.3" x="40" y="230" width="150" height="80" rx="4"/>
          <text font-size="12.5" font-weight="700" fill="#172536" x="115" y="254" text-anchor="middle">Vehicle</text>
          <text font-size="11" fill="#526273" x="115" y="272" text-anchor="middle">VIN pseudonym V-7f3a</text>
          <text font-size="11" fill="#526273" x="115" y="288" text-anchor="middle">trip 2026-11-12 · sensor set S1</text></g>
        <g><rect fill="#FFFFFF" stroke="#526273" stroke-width="1.3" x="270" y="230" width="190" height="80" rx="4"/>
          <text font-size="12.5" font-weight="700" fill="#172536" x="365" y="254" text-anchor="middle">Vehicle gateway</text>
          <text font-size="11" fill="#526273" x="365" y="272" text-anchor="middle">telematics + camera feed</text>
          <text font-size="11" fill="#526273" x="365" y="288" text-anchor="middle">device wallet · signs frames</text></g>
        <g><rect fill="#FFFFFF" stroke="#526273" stroke-width="1.3" x="540" y="230" width="190" height="80" rx="4"/>
          <text font-size="12.5" font-weight="700" fill="#172536" x="635" y="254" text-anchor="middle">AI Labelling Agent</text>
          <text font-size="11" fill="#526273" x="635" y="272" text-anchor="middle">event detection + labelling</text>
          <text font-size="11" fill="#526273" x="635" y="288" text-anchor="middle">agent wallet · model v1.4</text></g>
        <g><rect fill="#FFFFFF" stroke="#526273" stroke-width="1.3" x="810" y="230" width="190" height="80" rx="4"/>
          <text font-size="12.5" font-weight="700" fill="#172536" x="905" y="254" text-anchor="middle">Data Product Portal</text>
          <text font-size="11" fill="#526273" x="905" y="272" text-anchor="middle">operated by MobilityData</text>
          <text font-size="11" fill="#526273" x="905" y="288" text-anchor="middle">checks result, issues certificate</text></g>
        <g><rect fill="#FFFFFF" stroke="#526273" stroke-width="1.3" x="1080" y="230" width="170" height="80" rx="4"/>
          <text font-size="12.5" font-weight="700" fill="#172536" x="1165" y="254" text-anchor="middle">Data consumer</text>
          <text font-size="11" fill="#526273" x="1165" y="272" text-anchor="middle">OEM, insurer, authority</text>
          <text font-size="11" fill="#526273" x="1165" y="288" text-anchor="middle">any VC verifier</text></g>

        <!-- Flow edges -->
        <path fill="none" stroke="#526273" stroke-width="1.2" d="M190,270 H266" marker-end="url(#ar3)"/>
        <text font-size="10.5" fill="#526273" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" x="229" y="219" text-anchor="middle">sensor stream</text>
        <path fill="none" stroke="#526273" stroke-width="1.2" d="M460,270 H536" marker-end="url(#ar3)"/>
        <text font-size="10.5" fill="#526273" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" x="499" y="206" text-anchor="middle">signed frames</text>
        <text font-size="10.5" fill="#526273" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" x="499" y="219" text-anchor="middle">+ gateway assertion</text>
        <path fill="none" stroke="#526273" stroke-width="1.2" d="M730,270 H806" marker-end="url(#ar3)"/>
        <text font-size="10.5" fill="#526273" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" x="769" y="206" text-anchor="middle">AI Labelling</text>
        <text font-size="10.5" fill="#526273" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" x="769" y="219" text-anchor="middle">Result VC</text>
        <path fill="none" stroke="#167D8D" stroke-width="1.8" d="M1000,270 H1076" marker-end="url(#ar3-acc)"/>
        <text font-size="10.5" fill="#167D8D" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" x="1038" y="206" text-anchor="middle">Data Provenance</text>
        <text font-size="10.5" fill="#167D8D" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" x="1038" y="219" text-anchor="middle">Certificate VC</text>

        <!-- Row 3: credentials produced -->
        <path fill="none" stroke="#526273" stroke-width="1.2" d="M365,310 V386" marker-end="url(#ar3)"/>
        <text font-size="10.5" fill="#526273" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" x="373" y="352" text-anchor="start">signs</text>
        <path fill="none" stroke="#526273" stroke-width="1.2" d="M635,310 V386" marker-end="url(#ar3)"/>
        <text font-size="10.5" fill="#526273" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" x="643" y="352" text-anchor="start">issues</text>
        <path fill="none" stroke="#167D8D" stroke-width="1.8" d="M905,310 V386" marker-end="url(#ar3-acc)"/>
        <text font-size="10.5" fill="#167D8D" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" x="913" y="352" text-anchor="start">issues</text>
        <path fill="none" stroke="#526273" stroke-width="1.2" d="M1165,310 V386" marker-end="url(#ar3)"/>
        <text font-size="10.5" fill="#526273" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" x="1173" y="352" text-anchor="start">verifies</text>

        <g><rect fill="#F5F7F9" stroke="#526273" stroke-width="0.9" x="270" y="390" width="190" height="72" rx="4"/>
          <text font-size="12.5" font-weight="700" fill="#172536" x="365" y="412" text-anchor="middle">Frame input</text>
          <text font-size="11" fill="#526273" x="365" y="430" text-anchor="middle">frame hashes · time · trip</text>
          <text font-size="11" fill="#526273" x="365" y="446" text-anchor="middle">signed with gateway key</text></g>

        <g><rect fill="#FFFFFF" stroke="#526273" stroke-width="1.3" x="540" y="390" width="190" height="172" rx="4"/>
          <text font-size="12.5" font-weight="700" fill="#172536" x="635" y="412" text-anchor="middle">AI Labelling Result VC</text>
          <text font-size="11" fill="#526273" x="552" y="434">task assertion</text>
          <text font-size="11" fill="#526273" x="552" y="450">set-up assertion</text>
          <text font-size="11" fill="#526273" x="552" y="466">object assertion</text>
          <text font-size="11" fill="#526273" x="552" y="482">gateway assertion</text>
          <text font-size="11" fill="#526273" x="552" y="498">input assertion</text>
          <line x1="552" y1="508" x2="718" y2="508" stroke="#526273" stroke-width="0.8"/>
          <text font-size="11" fill="#172536" x="552" y="526">result: hard-braking event</text>
          <text font-size="11" fill="#172536" x="552" y="542">label: dangerous situation · conf 0.91</text></g>

        <g><rect fill="#EAF6F4" stroke="#167D8D" stroke-width="2" x="810" y="390" width="190" height="140" rx="4"/>
          <text font-size="12.5" font-weight="700" fill="#167D8D" x="905" y="412" text-anchor="middle">Data Provenance Certificate VC</text>
          <text font-size="11" fill="#526273" x="822" y="434">issuer: MobilityData GmbH (EUCC)</text>
          <text font-size="11" fill="#526273" x="822" y="450">subject: dataset DS-2026-1112</text>
          <text font-size="11" fill="#526273" x="822" y="466">content: labelled trip segments</text>
          <text font-size="11" fill="#526273" x="822" y="482">evidence root: hash of result</text>
          <text font-size="11" fill="#526273" x="822" y="498">links: Agent Card, Task Auth.,</text>
          <text font-size="11" fill="#526273" x="822" y="514">TÜV SÜD certificates</text></g>

        <g><rect fill="#F5F7F9" stroke="#526273" stroke-width="0.9" x="1080" y="390" width="170" height="140" rx="4"/>
          <text font-size="12.5" font-weight="700" fill="#172536" x="1165" y="412" text-anchor="middle">Verifier checks</text>
          <text font-size="11" fill="#526273" x="1092" y="434">1 proof of certificate</text>
          <text font-size="11" fill="#526273" x="1092" y="450">2 EUCC → MobilityData</text>
          <text font-size="11" fill="#526273" x="1092" y="466">3 Agent Card, Task Auth.</text>
          <text font-size="11" fill="#526273" x="1092" y="482">4 TÜV SÜD certificates</text>
          <text font-size="11" fill="#526273" x="1092" y="498">5 evidence hashes</text>
          <text font-size="11" fill="#526273" x="1092" y="514">6 status / revocation</text></g>
      </svg>
