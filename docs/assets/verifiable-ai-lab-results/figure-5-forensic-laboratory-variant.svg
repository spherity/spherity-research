<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660" role="img" aria-labelledby="figure-5-forensic-laboratory-variant-title figure-5-forensic-laboratory-variant-desc" font-family="Arial, Liberation Sans, sans-serif">
<title id="figure-5-forensic-laboratory-variant-title">Forensic laboratory variant: third-party AI models on lab data</title>
<desc id="figure-5-forensic-laboratory-variant-desc">An exhibit is measured by an instrument with a LIMS gateway that signs raw data, an AI evaluation service running a third-party chemistry model issues an AI Analysis Result credential, and the laboratory's report service issues a Forensic Result Certificate to court, prosecutor or defence expert. The laboratory, a public body accredited by DAkkS, issues instrument identity, Agent Card and Task Authorization. The AI model vendor issues a model credential to the AI service; a calibration laboratory issues a Digital Calibration Certificate to the instrument. Illustrative scenario.</desc>
<rect x="0" y="0" width="1280" height="660" fill="#FFFFFF"/>
<defs>
          <marker id="ar5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#526273"/></marker>
          <marker id="ar5-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#167D8D"/></marker>
        </defs>

        <!-- Row 0: register -->
        <g><rect fill="#EEF4FA" stroke="#183B63" stroke-width="1.2" stroke-dasharray="5 3" x="310" y="40" width="220" height="60" rx="12"/>
          <text font-size="12.5" font-weight="700" fill="#172536" x="420" y="64" text-anchor="middle">DAkkS · accreditation body</text>
          <text font-size="11" fill="#526273" x="420" y="82" text-anchor="middle">ISO/IEC 17025 accreditation</text></g>

                <g><rect fill="#EEF4FA" stroke="#183B63" stroke-width="1.2" stroke-dasharray="5 3" x="760" y="40" width="220" height="60" rx="12"/>
          <text font-size="12.5" font-weight="700" fill="#172536" x="870" y="64" text-anchor="middle">Calibration laboratory</text>
          <text font-size="11" fill="#526273" x="870" y="82" text-anchor="middle">DCC issuer · PTB-traceable</text></g>

        <!-- Row 1: legal person and conformity body -->
        <g><rect fill="#EEF4FA" stroke="#183B63" stroke-width="1.2" stroke-dasharray="5 3" x="310" y="140" width="340" height="70" rx="12"/>
          <text font-size="12.5" font-weight="700" fill="#172536" x="480" y="164" text-anchor="middle">Forensic laboratory · public body</text>
          <text font-size="11" fill="#526273" x="480" y="182" text-anchor="middle">e.g. a federal criminal police laboratory · LIMS wallet</text>
          <text font-family="Liberation Mono, Courier New, monospace" font-size="10.5" fill="#526273" x="480" y="198" text-anchor="middle">did:web:forensic-lab.example</text></g>
        <g><rect fill="#EEF4FA" stroke="#183B63" stroke-width="1.2" stroke-dasharray="5 3" x="760" y="140" width="220" height="70" rx="12"/>
          <text font-size="12.5" font-weight="700" fill="#172536" x="870" y="164" text-anchor="middle">AI model vendor · legal person</text>
          <text font-size="11" fill="#526273" x="870" y="182" text-anchor="middle">chemistry software firm · EUCC</text>
          <text font-size="11" fill="#526273" x="870" y="198" text-anchor="middle">issues the model credential</text></g>

        <!-- Trust edges -->
        <path fill="none" stroke="#526273" stroke-width="1.2" stroke-dasharray="5 3" d="M420,100 V136" marker-end="url(#ar5)"/>
        <text font-size="10.5" fill="#526273" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" x="428" y="124" text-anchor="start">accreditation · public-body identity</text>
        <path fill="none" stroke="#526273" stroke-width="1.2" stroke-dasharray="5 3" d="M870,40 V22 H285 V286" marker-end="url(#ar5)"/>
        <text font-size="10.5" fill="#526273" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" x="580" y="16" text-anchor="middle">Digital Calibration Certificate (DCC) · PTB-traceable</text>
        <path fill="none" stroke="#526273" stroke-width="1.2" stroke-dasharray="5 3" d="M800,210 V250 H700 V286" marker-end="url(#ar5)"/>
        <text font-size="10.5" fill="#526273" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" x="808" y="236" text-anchor="start">model credential</text>
        <text font-size="10.5" fill="#526273" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" x="808" y="250" text-anchor="start">model v2.0 · validated method</text>
        <path fill="none" stroke="#526273" stroke-width="1.2" stroke-dasharray="5 3" d="M380,210 V286" marker-end="url(#ar5)"/>
        <text font-size="10.5" fill="#526273" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" x="388" y="252" text-anchor="start">instrument identity</text>
        <path fill="none" stroke="#526273" stroke-width="1.2" stroke-dasharray="5 3" d="M600,210 V286" marker-end="url(#ar5)"/>
        <text font-size="10.5" fill="#526273" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" x="608" y="238" text-anchor="start">Agent Card +</text>
        <text font-size="10.5" fill="#526273" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" x="608" y="252" text-anchor="start">Task Authorization</text>

        <!-- Row 2: operational flow -->
        <g><rect fill="#FFFFFF" stroke="#526273" stroke-width="1.3" x="40" y="290" width="150" height="80" rx="4"/>
          <text font-size="12.5" font-weight="700" fill="#172536" x="115" y="314" text-anchor="middle">Exhibit (Asservat)</text>
          <text font-size="11" fill="#526273" x="115" y="332" text-anchor="middle">sample S-2026-0931</text>
          <text font-size="11" fill="#526273" x="115" y="348" text-anchor="middle">chain of custody credential</text></g>
        <g><rect fill="#FFFFFF" stroke="#526273" stroke-width="1.3" x="270" y="290" width="190" height="80" rx="4"/>
          <text font-size="12.5" font-weight="700" fill="#172536" x="365" y="314" text-anchor="middle">Instrument + LIMS gateway</text>
          <text font-size="11" fill="#526273" x="365" y="332" text-anchor="middle">e.g. GC-MS, IR or Raman</text>
          <text font-size="11" fill="#526273" x="365" y="348" text-anchor="middle">device wallet · signs raw data</text></g>
        <g><rect fill="#FFFFFF" stroke="#526273" stroke-width="1.3" x="540" y="290" width="190" height="80" rx="4"/>
          <text font-size="12.5" font-weight="700" fill="#172536" x="635" y="314" text-anchor="middle">AI evaluation service</text>
          <text font-size="11" fill="#526273" x="635" y="332" text-anchor="middle">spectral match · substance ID</text>
          <text font-size="11" fill="#526273" x="635" y="348" text-anchor="middle">agent wallet · vendor model v2.0</text></g>
        <g><rect fill="#FFFFFF" stroke="#526273" stroke-width="1.3" x="810" y="290" width="190" height="80" rx="4"/>
          <text font-size="12.5" font-weight="700" fill="#172536" x="905" y="314" text-anchor="middle">Forensic report service</text>
          <text font-size="11" fill="#526273" x="905" y="332" text-anchor="middle">operated by the laboratory</text>
          <text font-size="11" fill="#526273" x="905" y="348" text-anchor="middle">signs as public body</text></g>
        <g><rect fill="#FFFFFF" stroke="#526273" stroke-width="1.3" x="1080" y="290" width="170" height="80" rx="4"/>
          <text font-size="12.5" font-weight="700" fill="#172536" x="1165" y="314" text-anchor="middle">Court · prosecutor · defence</text>
          <text font-size="11" fill="#526273" x="1165" y="332" text-anchor="middle">expert witnesses, other agencies</text>
          <text font-size="11" fill="#526273" x="1165" y="348" text-anchor="middle">any VC verifier</text></g>

        <!-- Flow edges -->
        <path fill="none" stroke="#526273" stroke-width="1.2" d="M190,330 H266" marker-end="url(#ar5)"/>
        <text font-size="10.5" fill="#526273" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" x="229" y="279" text-anchor="middle">measurement</text>
        <path fill="none" stroke="#526273" stroke-width="1.2" d="M460,330 H536" marker-end="url(#ar5)"/>
        <text font-size="10.5" fill="#526273" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" x="499" y="266" text-anchor="middle">signed raw data</text>
        <text font-size="10.5" fill="#526273" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" x="499" y="279" text-anchor="middle">+ instrument assertion</text>
        <path fill="none" stroke="#526273" stroke-width="1.2" d="M730,330 H806" marker-end="url(#ar5)"/>
        <text font-size="10.5" fill="#526273" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" x="769" y="266" text-anchor="middle">AI Analysis</text>
        <text font-size="10.5" fill="#526273" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" x="769" y="279" text-anchor="middle">Result VC</text>
        <path fill="none" stroke="#167D8D" stroke-width="1.8" d="M1000,330 H1076" marker-end="url(#ar5-acc)"/>
        <text font-size="10.5" fill="#167D8D" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" x="1038" y="266" text-anchor="middle">Forensic Result</text>
        <text font-size="10.5" fill="#167D8D" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" x="1038" y="279" text-anchor="middle">Certificate VC</text>

        <!-- Row 3: credentials produced -->
        <path fill="none" stroke="#526273" stroke-width="1.2" d="M365,370 V446" marker-end="url(#ar5)"/>
        <text font-size="10.5" fill="#526273" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" x="373" y="412" text-anchor="start">signs</text>
        <path fill="none" stroke="#526273" stroke-width="1.2" d="M635,370 V446" marker-end="url(#ar5)"/>
        <text font-size="10.5" fill="#526273" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" x="643" y="412" text-anchor="start">issues</text>
        <path fill="none" stroke="#167D8D" stroke-width="1.8" d="M905,370 V446" marker-end="url(#ar5-acc)"/>
        <text font-size="10.5" fill="#167D8D" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" x="913" y="412" text-anchor="start">issues</text>
        <path fill="none" stroke="#526273" stroke-width="1.2" d="M1165,370 V446" marker-end="url(#ar5)"/>
        <text font-size="10.5" fill="#526273" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" x="1173" y="412" text-anchor="start">verifies</text>

        <g><rect fill="#F5F7F9" stroke="#526273" stroke-width="0.9" x="270" y="450" width="190" height="72" rx="4"/>
          <text font-size="12.5" font-weight="700" fill="#172536" x="365" y="472" text-anchor="middle">Raw data</text>
          <text font-size="11" fill="#526273" x="365" y="490" text-anchor="middle">raw-data hash · time · analyst</text>
          <text font-size="11" fill="#526273" x="365" y="506" text-anchor="middle">signed with instrument key</text></g>

        <g><rect fill="#FFFFFF" stroke="#526273" stroke-width="1.3" x="540" y="450" width="190" height="172" rx="4"/>
          <text font-size="12.5" font-weight="700" fill="#172536" x="635" y="472" text-anchor="middle">AI Analysis Result VC</text>
          <text font-size="11" fill="#526273" x="552" y="494">task assertion</text>
          <text font-size="11" fill="#526273" x="552" y="510">set-up assertion</text>
          <text font-size="11" fill="#526273" x="552" y="526">object assertion</text>
          <text font-size="11" fill="#526273" x="552" y="542">instrument assertion</text>
          <text font-size="11" fill="#526273" x="552" y="558">input assertion</text>
          <line x1="552" y1="568" x2="718" y2="568" stroke="#526273" stroke-width="0.8"/>
          <text font-size="11" fill="#172536" x="552" y="586">result: substance identified</text>
          <text font-size="11" fill="#172536" x="552" y="602">library match 0.96 · method M-12</text></g>

        <g><rect fill="#EAF6F4" stroke="#167D8D" stroke-width="2" x="810" y="450" width="190" height="140" rx="4"/>
          <text font-size="12.5" font-weight="700" fill="#167D8D" x="905" y="472" text-anchor="middle">Forensic Result Certificate VC</text>
          <text font-size="11" fill="#526273" x="822" y="494">issuer: forensic laboratory</text>
          <text font-size="11" fill="#526273" x="822" y="510">subject: exhibit S-2026-0931</text>
          <text font-size="11" fill="#526273" x="822" y="526">result: substance identified</text>
          <text font-size="11" fill="#526273" x="822" y="542">evidence root: hash of result</text>
          <text font-size="11" fill="#526273" x="822" y="558">links: Agent Card, model credential,</text>
          <text font-size="11" fill="#526273" x="822" y="574">DCC, accreditation, custody</text></g>

        <g><rect fill="#F5F7F9" stroke="#526273" stroke-width="0.9" x="1080" y="450" width="170" height="140" rx="4"/>
          <text font-size="12.5" font-weight="700" fill="#172536" x="1165" y="472" text-anchor="middle">Verifier checks</text>
          <text font-size="11" fill="#526273" x="1092" y="494">1 accreditation → lab · mandate</text>
          <text font-size="11" fill="#526273" x="1092" y="510">2 Agent Card · model credential</text>
          <text font-size="11" fill="#526273" x="1092" y="526">3 library versions · method</text>
          <text font-size="11" fill="#526273" x="1092" y="542">4 raw-data hash · signature</text>
          <text font-size="11" fill="#526273" x="1092" y="558">5 instrument identity · DCC</text>
          <text font-size="11" fill="#526273" x="1092" y="574">6 exhibit · custody · status</text></g>
      </svg>
