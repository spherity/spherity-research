 <title id="robot-arm-reference-model-title">Robot Arm Reference Model for access-controlled Physical AI compliance evidence</title>
 <desc id="robot-arm-reference-model-description">A seven-axis robot arm and independent local protection connect to component passports, arm-assembly records and application evidence. An access-controlled Verifiable Safety Assurance Evidence Graph supports a scoped assessment for the installed configuration, intended use and current status.</desc>
 <metadata>
  <rdf:RDF xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:title>Robot Arm Reference Model: From the physical arm to a scoped assurance decision</dc:title>
    <dc:description>Component passports, arm-assembly records and application evidence contribute to an access-controlled VSAEG for robot and robot-component passports, compliance evidence, functional safety, cyber resilience and Physical AI compliance.</dc:description>
