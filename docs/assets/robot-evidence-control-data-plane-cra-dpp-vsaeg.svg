    <dc:subject>Robot evidence control plane; robot evidence data plane; CRA-capable Digital Product Passport; Verifiable Safety Assurance Evidence Graph; European Business Wallet; Edge Wallet; functional safety; cyber resilience; AI compliance</dc:subject>
