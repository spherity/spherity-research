 <title id="robot-evidence-planes-title">Robot Evidence Control and Data Plane for access-controlled VSAEG decisions</title>
 <desc id="robot-evidence-planes-description">Business Wallet and Edge Wallet services govern organizational authority and access while safety, Cyber Resilience Act and AI evidence connect through a CRA-capable Digital Product Passport and Verifiable Safety Assurance Evidence Graph for scoped regulatory and operational decisions.</desc>
 <metadata>
  <rdf:RDF xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:title>Robot Evidence Control and Data Plane: Shared evidence with distinct regulatory responsibilities</dc:title>
    <dc:description>Safety, CRA and AI evidence is linked through product identity and configuration in a CRA-capable DPP and access-controlled VSAEG. Organizational trust and Edge Wallet services govern authority, access and scoped verification.</dc:description>
    <dc:date>2026-09-09</dc:date>
    <dc:format>image/svg+xml</dc:format>
    <dc:creator>
