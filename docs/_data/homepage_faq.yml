groups:
  - title: "Europe, AI and industrial renewal"
    description: "Strategy and policy questions about trusted execution, competitiveness and coordinated transformation."
    items:
      - id: "europe-trust-production-factor"
        question: "How can Europe turn trust into a production factor for AI productivity and industrial renewal?"
        answer: "Europe can convert its legal, institutional and industrial strengths into trusted execution capital: reusable identity, authorization, evidence and accountability infrastructure that lets organizations act faster without weakening control."
        link_label: "Read Europe’s Fundamental AI Opportunity"
        url: "/europes-fundamental-ai-opportunity.html"
      - id: "deutschland-ag-federated-transformation"
        question: "How can Deutschland AG 2.0 connect metropolitan regions, Industrial AI, sustainability, security and resilience?"
        answer: "The proposed model treats Germany as a federated transformation system in which metropolitan regions, industry, the Mittelstand, research and government share missions, interoperable infrastructure, decision rights and measurable outcomes."
        link_label: "Read the Deutschland AG 2.0 paper"
        url: "/deutschland-ag-2-0-industrial-ai-federated-transformation.html"
      - id: "trusted-agentic-ai-geographies"
        question: "How do China, Europe and the United States compare in trusted agentic AI deployment capability?"
        answer: "The three regions combine scale, regulation, industrial capacity and digital infrastructure differently. Europe’s opportunity is to make verifiable authority, evidence provenance and accountable execution a practical advantage for Industrial AI and Physical AI."
        link_label: "Read the China–EU–US comparative analysis"
        url: "/trusted-agentic-ai-china-eu-us-comparative-analysis.html"
      - id: "german-industrial-ai-stack"
        question: "Which German companies form a strategic stack for Industrial AI, Physical AI and trusted agentic commerce?"
        answer: "The research identifies ten emerging companies and complementary corporate anchors across AI, automation, robotics, energy, autonomous systems and cross-company trust infrastructure, using an explicit selection method rather than a valuation ranking."
        link_label: "Read the German technology outlook"
        url: "/top-german-technology-companies-industrial-ai-agentic-commerce-2026.html"

  - title: "DPP, DBP, wallets and data sharing"
    description: "Implementation questions about product evidence, regulated access and reusable organizational authority."
    items:
      - id: "cra-capable-dpp"
        question: "How can CRA-capable Digital Product Passports turn static compliance into continuous cyber assurance?"
        answer: "A CRA-capable DPP can connect signed SBOM, VEX, vulnerability, conformity and lifecycle evidence in an access-controlled evidence graph, giving manufacturers and authorized parties current, verifiable product-security information."
        link_label: "Read the CRA-capable DPP research"
        url: "/cra-capable-digital-product-passports.html"
      - id: "dpp-evidence-and-authority"
        question: "How can DPP and DBP transactions verify both product evidence and the legal authority to act?"
        answer: "The architecture links product-bound identity and evidence with legal-person identity, verifiable credentials, mandates and policy checks, so a relying party can verify both what is claimed about a product and who is authorized to disclose or act on it."
        link_label: "Read Verifiable, Access-Controlled Digital Product Passports"
        url: "/verifiable-access-controlled-digital-product-passports.html"
      - id: "ebw-market-role-access"
        question: "How can European Business Wallets and market-role credentials control DPP, DBP and BESS data access?"
        answer: "European Business Wallets can present verifiable company and market-role credentials to a policy engine, which evaluates purpose, role, mandate and context before granting access to sensitive product or energy data."
        link_label: "Read the energy data-X reference case"
        url: "/energy-data-x-ebw-market-role-credentials-dpp-access-control.html"
      - id: "spherity-dpp-market-position"
        question: "How does Spherity connect its Gartner® Pioneers position to DPP, DBP, EBW and Trusted AI execution?"
        answer: "Spherity treats the Gartner placement as one independent market perspective and describes an identity-first strategy that connects cyber-secure DPP and DBP infrastructure with European Business Wallets, governed data sharing and a longer-term AI Service Passport outlook."
        link_label: "Read Spherity’s DPP and DBP strategy paper"
        url: "/spherity-dpp-dbp-strategy-market-positioning.html"
      - id: "ebw-adoption-gates"
        question: "Which legal and operational gates shape European Business Wallet adoption?"
        answer: "Adoption depends on legislation, implementing acts, standards, wallet and trust-service readiness, governance, conformance testing, procurement and viable cross-border use cases progressing in a coordinated sequence."
        link_label: "Read the European Business Wallet roadmap"
        url: "/ebw-roadmap.html"

  - title: "Identity, evidence and resilience"
    description: "Architecture questions about accountable AI, provenance and migration of the trust fabric."
    items:
      - id: "industrial-ai-evidence-graphs"
        question: "How can Industrial AI trace provenance, validation, freshness and conflicting evidence across organizations?"
        answer: "Evidence graphs represent claims, sources, issuers, transformations, validation status, timestamps, conflicts and uncertainty as connected evidence paths that people and machines can inspect and audit."
        link_label: "Read the Industrial AI evidence-graph paper"
        url: "/evidence-graphs-industrial-ai-data-plane.html"
      - id: "ai-agent-legal-authority"
        question: "How can an enterprise prove an AI agent’s legal authority for a specific action?"
        answer: "An enterprise can bind the agent to a verified legal person, a current mandate, explicit policy constraints and an action receipt, then validate that authorization independently at the time of the transaction."
        link_label: "Read the European Business Wallet control-plane paper"
        url: "/ebw-zero-trust-ai-agents.html"
      - id: "pqc-resilient-corridor"
        question: "How can organizations establish a governed, PQC-resilient digital corridor?"
        answer: "Organizations first establish accountable identity and mandates, then map issuers, wallets, verifiers, trust anchors and lifecycle dependencies before coordinating assurance levels, cryptographic profiles, downgrade rules and migration evidence within a bounded ecosystem."
        link_label: "Read the PQC Corridor paper"
        url: "/quantum-resilient-organizational-identity.html"
      - id: "post-quantum-identity-dependencies"
        question: "Which digital-identity dependencies must migrate for post-quantum readiness?"
        answer: "Migration must cover more than algorithms: keys, certificates, trust anchors, wallets, registries, status and revocation services, protocols, vendors, governance and long-lived evidence all need crypto-agile transition plans."
        link_label: "Read the quantum-vulnerability research"
        url: "/Securing-Digital-Identity-Quantum-Vulnerabilities.html"
      - id: "coupled-technology-risks"
        question: "How can Germany and the EU test readiness across coupled technology risks?"
        answer: "Decision-makers can use cross-domain scenarios to test how cyber, AI, quantum, hybrid and physical risks reinforce one another, then assign indicators, owners, thresholds and coordinated response actions."
        link_label: "Read the integrated threat model"
        url: "/threat-escalation-model-germany-eu.html"
